spring:
  application:
    name: gateway
  profiles:
    active: ${ACTIVE_PROFILE:dev}
  cloud:
    discovery:
      enabled: true
    gateway:
      server:
        webmvc:
          routes:
            - id: authorization-server
              uri: lb://AUTHORIZATIONSERVER
              predicates:
                - Path=/authorization/**

            - id: user-service
              uri: lb://USERSERVICE
              predicates:
                - Path=/user/**

            - id: ticket-service
              uri: lb://TICKETSERVICE
              predicates:
                - Path=/ticket/**

            - id: notification-service
              uri: lb://NOTIFICATIONSERVICE
              predicates:
                - Path=/notification/**

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://${USER_NAME}:${PASSWORD}@localhost:5002/eureka/
    fetch-registry: true
    register-with-eureka: true

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.gateway.route: DEBUG

server:
  port: ${SERVER_PORT}

jwks:
  uri: ${JWKS_URI}
