{{ test() }}
<div id="taskmodal" class="justify-center items-center">
  <div class="relative w-full max-w-2xl max-h-full">
    <div class="relative bg-white rounded-lg">
      <div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t">
        <h3 class="text-xl font-semibold text-gray-900">Create Task</h3>
        <button
          (click)="this.dialogRef.close()"
          type="button"
          class="bg-gray-100 text-gray-600 hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center"
        >
          <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6" />
          </svg>
        </button>
      </div>
      <div class="p-4 md:p-5 space-y-4">
        <form>
          <input type="hidden" name="ticketUuid" required />
          <div class="mb-6">
            <label for="title" class="block mb-2 text-sm font-medium text-gray-900">Name</label>
            <input
              type="text"
              name="name"
              class="border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
              placeholder="Example: Finish creating customer report"
              required
            />
          </div>
          <div class="mb-6">
            <label for="description" class="block mb-2 text-sm font-medium text-gray-900">Description</label>
            <textarea
              name="description"
              id="description"
              placeholder="Example: I need to finish creating customer sales report by Tuesday and send it to customer"
              cols=""
              rows=""
              class="p-2 text-sm font-normal shadow-xs text-gray-900 placeholder-gray-400 rounded-lg border border-gray-300 w-full h-20"
              required
            ></textarea>
          </div>
          <div class="mb-6">
            <label for="type" class="block mb-2 text-sm font-medium text-gray-900">Status</label>
            <select
              name="status"
              required
              class="w-full rounded-md border-0 ml-0 px-2 py-2 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-full0 sm:text-sm sm:leading-6"
            >
              <option>NEW</option>
              <option>IN PROGRESS</option>
              <option>IN REVIEW</option>
              <option>COMPLETED</option>
              <option>IMPEDED</option>
              <option>ASSIGNED</option>
              <option>CLOSED</option>
              <option>PENDING</option>
            </select>
          </div>
          <div class="flex items-center justify-end gap-3 mt-3 border-t border-gray-200">
            <button
              type="submit"
              data-modal-hide="taskmodal"
              class="disabled:bg-gray-300 text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm p-2 mt-3"
            >
              Create Task
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
