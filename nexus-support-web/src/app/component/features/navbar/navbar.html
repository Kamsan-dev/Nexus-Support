<nav class="bg-gray-900 fixed w-full top-0 left-0 z-40">
  <div class="container h-16 mx-auto navmenu">
    <div class="relative h-16 flex items-center justify-between">
      <div class="absolute inset-y-0 left-0 flex items-center lg:hidden">
        <button

          type="button"
          class="relative inline-flex items-center justify-center rounded-md p-2 text-gray-400 hover:bg-gray-700 hover:text-white focus:outline-none focus:ring-2 focus:ring-inset focus:ring-white"
          aria-controls="mobile-menu"
          aria-expanded="false"
        >
          @if (!isNavOpen()) {
            <svg
              class="block h-6 w-6"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"
              />
            </svg>
          } @else {
            <svg
              class="h-6 w-6"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              aria-hidden="true"
            >
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          }
        </button>
      </div>
      <div class="flex flex-1 items-center justify-center sm:items-stretch sm:justify-start">
        <div
          href=""
          class="flex-shrink-0 items-center hidden cursor-pointer lg:block"
          [routerLink]="['']"
        >
          <img
            class="h-8 w-auto"
            src="https://cdn-icons-png.flaticon.com/512/9732/9732800.png"
            alt="Ticket App"
          />
        </div>
        <div class="hidden sm:ml-6 lg:block">
          <div class="flex space-x-4">
            <a

              class="rounded-md px-3 py-2 text-sm font-medium text-white"
              >Dashboard</a

            <a
              [routerLink]="['/app/tickets/list']"
              [routerLinkActive]="['bg-gray-700']"
              class="rounded-md px-3 py-2 text-sm font-medium text-white hover:bg-gray-700"
              >Tickets</a
            >
            <a
              [routerLink]="['/app/users/list']"
              [routerLinkActive]="['bg-gray-700']"
              class="rounded-md px-3 py-2 text-sm font-medium text-white hover:bg-gray-700"
              >Users</a
            >
            <a
              [routerLink]="['/app/reports']"
              [routerLinkActive]="['bg-gray-700']"
              class="rounded-md px-3 py-2 text-sm font-medium text-white hover:bg-gray-700"
              >Reports</a
            >
            <a
              [routerLink]="['/app/messages/list']"
              [routerLinkActive]="['bg-gray-700']"
              class="rounded-md px-3 py-2 text-sm font-medium text-white hover:bg-gray-700 relative group"
              >Messages
              <span
                class="inline-flex items-center justify-center h-4 w-max px-[5px] py-[5px] text-xs font-semibold text-black bg-yellow-400 rounded-full"
                >8</span
              >
            </a>
          </div>
        </div>
      </div>
      <div class="relative flex items-center usermenu">
        <button
          (click)="onAddNewTicketClick($event, addFormTicket)"
          type="button"
          class="hover:bg-gray-700 relative bg-gray-800 p-1 text-white hover:text-white font-medium rounded-lg text-sm px-5 py-2.5 text-center inline-flex items-center mr-3"
        >
          <svg
            class="w-4 h-4 mr-1.5"
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            fill="currentColor"
            viewBox="0 0 16 16"
          >
            <path
              d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0M8.5 4.5a.5.5 0 0 0-1 0v3h-3a.5.5 0 0 0 0 1h3v3a.5.5 0 0 0 1 0v-3h3a.5.5 0 0 0 0-1h-3z"
            />
          </svg>
          New Ticket
        </button>
        <button
          (click)="toggleMenu()"
          type="button"
          class="flex items-center text-sm pe-1 font-medium text-white rounded-full md:me-0 focus:ring-1 focus:ring-gray-100"
        >
          <img
            class="w-8 h-8 me-2 rounded-full object-cover"
            src="https://images.unsplash.com/photo-1534528741775-53994a69daeb"
            alt="Junior"
          />
          Junior RT
          <svg
            class="w-2.5 h-2.5 ms-3"
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 10 6"
          >
            <path
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="m1 1 4 4 4-4"
            />
          </svg>
        </button>
        <div
          id="usermenu"
          class="transition ease-out transform duration-300 text-gray-700 bg-white divide-y divide-gray-100 rounded-lg shadow min-w-max top-10 right-0 absolute z-10"
          [ngClass]="[isMenuOpen() ? 'opacity-100  visible ' : 'opacity-0 invisible']"
        >
          <div class="px-4 py-3 text-sm text-gray-700">
            <div class="text-xs font-medium">Signed in as:</div>
            <div class="font-medium text-md">getarrayz@gmail.com</div>
          </div>
          <ul class="p-2 text-sm text-gray-700" aria-labelledby="dropdownHoverButton">
            <li
              href=""
              class="mb-3 pl-4 flex justify-start items-center cursor-pointer rounded-md hover:bg-gray-100"

              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="size-5"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"
                />

              <div

                Profile

            </li>
            <li

            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="size-5"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z"
                />
              </svg>
              <div class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Password</div>
            </li>
            <li
              href=""
              fragment="settings"
              class="mb-3 pl-4 flex justify-start items-center cursor-pointer rounded-md hover:bg-gray-100"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="size-5"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M4.5 12a7.5 7.5 0 0 0 15 0m-15 0a7.5 7.5 0 1 1 15 0m-15 0H3m16.5 0H21m-1.5 0H12m-8.457 3.077 1.41-.513m14.095-5.13 1.41-.513M5.106 17.785l1.15-.964m11.49-9.642 1.149-.964M7.501 19.795l.75-1.3m7.5-12.99.75-1.3m-6.063 16.658.26-1.477m2.605-14.772.26-1.477m0 17.726-.26-1.477M10.698 4.614l-.26-1.477M16.5 19.794l-.75-1.299M7.5 4.205 12 12m6.894 5.785-1.149-.964M6.256 7.178l-1.15-.964m15.352 8.864-1.41-.513M4.954 9.435l-1.41-.514M12.002 12l-3.75 6.495"
                />
              </svg>
              <div class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Settings</div>
            </li>
            <div class="mt-3 mb-3 border-t border-gray-200"></div>
            <li
              class="pl-4 flex justify-start items-center cursor-pointer rounded-md hover:bg-gray-100"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="size-5"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M8.25 9V5.25A2.25 2.25 0 0 1 10.5 3h6a2.25 2.25 0 0 1 2.25 2.25v13.5A2.25 2.25 0 0 1 16.5 21h-6a2.25 2.25 0 0 1-2.25-2.25V15m-3 0-3-3m0 0 3-3m-3 3H15"
                />
              </svg>
              <div class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Logout</div>
            </li>
          </ul>
        </div>
      </div>
    </div>
    <div
      id="navmenu"
      class="bg-gray-900 rounded-b-md lg:hidden overflow-hidden transition-all duration-300 ease-in-out"
      [ngClass]="{
        'max-h-96 opacity-100': isNavOpen(),
        'max-h-0 opacity-0': !isNavOpen(),
      }"
    >
      <div class="space-y-1 pb-3 pt-2">
        <a
          href=""
          class="block rounded-md px-3 py-2 text-base font-medium text-white bg-gray-700 hover:bg-gray-700"
          aria-current="page"
          >Dashboard</a
        >
        <a
          href=""
          class="block rounded-md px-3 py-2 text-base font-medium text-white bg-gray-700 hover:bg-gray-700"
          >Tickets</a
        >
        <a
          href=""
          class="block rounded-md px-3 py-2 text-base font-medium text-white bg-gray-700 hover:bg-gray-700"
          >Users</a
        >
        <a
          href=""
          class="block rounded-md px-3 py-2 text-base font-medium text-white bg-gray-700 hover:bg-gray-700"
          >Reports</a
        >
        <a
          href=""
          class="block rounded-md px-3 py-2 text-base font-medium text-white bg-gray-700 hover:bg-gray-700"
          >Messages
          <span
            class="inline-flex items-center justify-center w-4 h-4 text-xs font-semibold text-black bg-yellow-300 rounded-full"
          ></span>
        </a>
      </div>
    </div>
  </div>
  <div class="loader">
    <div class="loader__element absolute top-15"></div>
  </div>
</nav>

<ng-template #addFormTicket>
  <div class="divide-y divide-gray-100">
    <div class="p-5">
      <span class="text-xl font-semibold">New Ticket</span>
    </div>
    <div class="space-y-6 p-5">
      <!-- Title -->
      <form class="space-y-3">
        <div>
          <label for="title" class="mb-2 block text-sm font-medium text-gray-800">Title</label>
          <input
            type="text"
            formControlName="title"
            id="title"
            placeholder="Example: I cannot log in"
            class="border border-gray-200 text-gray-900 text-sm rounded-lg w-full p-2.5 focus:ring-blue-500 focus:border-blue-500"
          />
          <!-- @if (f['title'].invalid && f['title'].dirty) {
      <div class="mt-2 font-normal text-red-500">Title is required</div>
    } -->
        </div>

        <!-- Description -->
        <div>
          <label for="description" class="mb-2 block text-sm font-medium text-gray-800"
            >Description</label
          >
          <textarea
            formControlName="description"
            id="description"
            rows="4"
            placeholder="Example: I'm not able to log in because my account has been locked"
            class="border border-gray-200 text-gray-900 text-sm rounded-lg w-full p-2.5 focus:ring-blue-500 focus:border-blue-500"
          ></textarea>
          <!-- @if (f['description'].invalid && f['description'].dirty) {
      <div class="mt-2 font-normal text-red-500">Description is required</div>
    } -->
        </div>

        <!-- Type + Priority -->
        <div class="grid gap-6 md:grid-cols-2">
          <div>
            <label for="type" class="mb-2 block text-sm font-medium text-gray-800">Type</label>
            <select
              formControlName="type"
              id="type"
              class="border border-gray-200 text-gray-900 text-sm rounded-lg w-full p-2.5 focus:ring-blue-500 focus:border-blue-500"
            >
              <option value="" disabled selected>type</option>
              <option value="bug">Bug</option>
              <option value="feature">Feature</option>
              <option value="support">Support</option>
            </select>
          </div>

          <div>
            <label for="priority" class="mb-2 block text-sm font-medium text-gray-800"
              >Priority</label
            >
            <select
              formControlName="priority"
              id="priority"
              class="border border-gray-200 text-gray-900 text-sm rounded-lg w-full p-2.5 focus:ring-blue-500 focus:border-blue-500"
            >
              <option value="" disabled selected>priority</option>
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
              <option value="critical">Critical</option>
            </select>
          </div>
        </div>

        <!-- Dropzone -->
        <div class="mt-3">
          <label
            for="dropzone-file"
            class="flex flex-col items-center justify-center w-full h-36 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100 transition"
          >
            <div class="flex flex-col items-center justify-center pt-5 pb-6">
              <svg
                class="w-8 h-8 mb-3 text-gray-400"
                aria-hidden="true"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 20 16"
              >
                <path
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M13 13h3a3 3 0 0 0 0-6h-.025A5.56 5.56 0 0 0 16 6.5 5.5 5.5 0 0 0 5.207 5.021C5.137 5.017 5.071 5 5 5a4 4 0 0 0 0 8h2.167M10 15V6m0 0L8 8m2-2 2 2"
                />
              </svg>
              <p class="mb-1 text-sm text-gray-500">
                <span class="font-semibold">Click to attach files</span>
              </p>
              <p class="text-xs text-gray-500">PDF, DOC, PNG, JPG or GIF (MAX. 800x400px)</p>
            </div>
            <input id="dropzone-file" type="file" class="hidden" multiple (change)="(null)" />
          </label>
        </div>

        <!-- Fichier sélectionné (exemple) -->
        <div class="space-y-2">
          <div
            class="mt-2 flex items-center justify-between p-3 bg-white border border-gray-200 rounded-lg"
          >
            <div class="flex items-center gap-3">
              <svg
                class="w-5 h-5 text-gray-500"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"
                />
              </svg>
              <div>
                <p class="text-sm font-medium text-gray-800">//</p>
                <p class="text-xs text-gray-500">20 KB</p>
              </div>
            </div>
            <button type="button" class="text-gray-400 hover:text-red-500 transition">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M6 18L18 6M6 6l12 12"
                />
              </svg>
            </button>
          </div>
        </div>
      </form>
      <div class="divide-y divide-gray-100">
        <span></span>
      </div>

      <!-- Bouton Create Ticket -->
      <div class="flex justify-end pt-2">
        <button
          type="submit"
          class="px-5 py-2.5 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg focus:ring-4 focus:ring-blue-300 transition"
        >
          Create Ticket
        </button>
      </div>
    </div>
  </div>
</ng-template>
