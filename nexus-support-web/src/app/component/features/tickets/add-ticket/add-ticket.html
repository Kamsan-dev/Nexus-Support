<div class="divide-y divide-gray-100">
  <div class="p-5">
    <span class="text-xl font-semibold">New Ticket</span>
  </div>
  <div class="space-y-6 p-5">
    <form [formGroup]="modalForm" (ngSubmit)="onSubmitForm($event)">
      <div class="space-y-6">
        <!-- Title -->
        <div>
          <label for="title" class="mb-2 block text-sm font-medium text-gray-800">Title</label>
          <input
            type="text"
            formControlName="title"
            [ngClass]="[f['title'].invalid && f['title'].dirty ? 'border-red-500' : 'border-gray-200']"
            id="title"
            placeholder="Example: I cannot log in"
            class="border text-gray-900 text-sm rounded-lg w-full p-2.5 focus:ring-blue-500 focus:border-blue-500"
          />
          @if (f['title'].invalid && f['title'].dirty) {
            <div class="mt-2 font-normal text-red-500">Title is required</div>
          }
        </div>

        <!-- Description -->
        <div>
          <label for="description" class="mb-2 block text-sm font-medium text-gray-800">Description</label>
          <textarea
            formControlName="description"
            id="description"
            rows="4"
            [ngClass]="[f['description'].invalid && f['description'].dirty ? 'border-red-500' : 'border-gray-200']"
            placeholder="Example: I'm not able to log in because my account has been locked"
            class="border text-gray-900 text-sm rounded-lg w-full p-2.5 focus:ring-blue-500 focus:border-blue-500"
          ></textarea>
          @if (f['description'].invalid && f['description'].dirty) {
            <div class="mt-2 font-normal text-red-500">Description is required</div>
          }
        </div>

        <!-- Type -->
        <div class="grid gap-6 md:grid-cols-2">
          <div>
            <label for="type" class="mb-2 block text-sm font-medium text-gray-800">Type</label>

            <select
              id="type"
              formControlName="type"
              [ngClass]="[f['type'].invalid && f['type'].touched ? 'border-red-500' : 'border-gray-200']"
              class="border text-gray-900 text-sm rounded-lg w-full p-2.5 focus:ring-blue-500 focus:border-blue-500"
            >
              <option disabled selected>Select a type</option>
              @for (type of ticketTypes; track $index) {
                <option [value]="type">{{ ticketTypeLabel[type] }}</option>
              }
            </select>
          </div>
          <!-- Priotiy -->
          <div>
            <label for="priority" class="mb-2 block text-sm font-medium text-gray-800">Priority</label>
            <select
              id="type"
              formControlName="priority"
              [ngClass]="[f['priority'].invalid && f['priority'].touched ? 'border-red-500' : 'border-gray-200']"
              class="border text-gray-900 text-sm rounded-lg w-full p-2.5 focus:ring-blue-500 focus:border-blue-500"
            >
              <option disabled>Select a priority</option>
              @for (priority of ticketPriorities; track $index) {
                <option [value]="priority">{{ ticketPriorityLabel[priority] }}</option>
              }
            </select>
          </div>
        </div>

        <!-- Dropzone -->
        <div class="mt-3">
          <label
            for="dropzone-file"
            class="flex flex-col items-center justify-center w-full h-36 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100 transition"
          >
            <div class="flex flex-col items-center justify-center pt-5 pb-6">
              <svg class="w-8 h-8 mb-3 text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 16">
                <path
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M13 13h3a3 3 0 0 0 0-6h-.025A5.56 5.56 0 0 0 16 6.5 5.5 5.5 0 0 0 5.207 5.021C5.137 5.017 5.071 5 5 5a4 4 0 0 0 0 8h2.167M10 15V6m0 0L8 8m2-2 2 2"
                />
              </svg>
              <p class="mb-1 text-sm text-gray-500">
                <span class="font-semibold">Click to attach files</span>
              </p>
              <p class="text-xs text-gray-500">PDF, DOC, PNG, JPG or GIF (MAX. 800x400px)</p>
            </div>
            <input id="dropzone-file" type="file" class="hidden" multiple (change)="onFileChange($any($event.target.files))" />
          </label>
        </div>

        <!-- Fichier sélectionné (exemple) -->
        @if (files().length > 0) {
          <div class="space-y-2">
            @for (file of files(); track file.name) {
              <div class="mt-2 flex items-center justify-between p-3 bg-white border border-gray-200 rounded-lg">
                <div class="flex items-center gap-3">
                  <fa-icon [icon]="'paperclip'" class="fa-fw"></fa-icon>
                  <div>
                    <p class="text-sm font-medium text-gray-800">{{ file.name }}</p>
                    <p class="text-xs text-gray-500">{{ file.size }}</p>
                  </div>
                </div>
                <button type="button" class="text-gray-400 hover:text-red-500 transition cursor-pointer" (click)="removeFile($event, file)">
                  <fa-icon [icon]="'xmark'" class="fa-fw"></fa-icon>
                </button>
              </div>
            }
          </div>
        }
      </div>
      <div class="divide-y divide-gray-100">
        <span></span>
      </div>

      <!-- Bouton Create Ticket -->
      <div class="flex justify-end pt-2">
        <button
          type="submit"
          class="px-5 py-2.5 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg focus:ring-4 focus:ring-blue-300 transition"
        >
          Create Ticket
        </button>
      </div>
    </form>
  </div>
</div>
