<div class="container mx-auto pt-10">
  <div class="mt-4 flex flex-col items-center">
    <img
      class="size-20 rounded-md bg-gray-400 p-3"
      src="https://cdn-icons-png.flaticon.com/512/9732/9732800.png"
      alt="Your Company"
      width="80"
      height="80"
    />
    <h2 class="mt-5 text-xl font-semibold text-gray-800">Reset Password</h2>
  </div>
  <div class="mt-4 flex flex-col items-center">
    <div class="min-w-[30rem] p-4 rounded-lg p-3 border border-gray-200 bg-white">
      @if (message()) {
        <div class="flex items-center p-4 mb-4 text-green-800 rounded-lg bg-green-50">
          <p class="text-sm font-medium">{{ message() }}</p>
          <button
            (click)="closeMessage($event)"
            type="button"
            class="ms-auto -mx-1.5 -my-1.5 text-green-500 rounded-lg focus:ring-2 focus:ring-green-400 p-1.5 hover:bg-green-200 inline-flex items-center justify-center h-8 w-8"
            aria-label="Close"
          >
            <fa-icon [icon]="'xmark'" class="fa-fw" />
          </button>
        </div>
      }

      @if (error()) {
        <div class="flex items-center p-4 mb-4 text-red-800 rounded-lg bg-red-50">
          <p class="text-sm font-medium">{{ error() }}</p>
          <button
            (click)="closeMessage($event)"
            type="button"
            class="ms-auto -mx-1.5 -my-1.5 text-red-500 rounded-lg focus:ring-2 focus:ring-red-400 p-1.5 hover:bg-red-200 inline-flex items-center justify-center h-8 w-8"
            aria-label="Close"
          >
            <fa-icon [icon]="'xmark'" class="fa-fw" />
          </button>
        </div>
      }
      <form [formGroup]="resetForm" (ngSubmit)="onSubmitResetForm($event)">
        <div class="space-y-6">
          <div>
            <label for="email" class="mb-2 text-sm font-medium text-gray-800">Email address</label>
            <input
              type="email"
              formControlName="email"
              id="email"
              placeholder="Email address"
              class="border border border-gray-200 text-gray-900 text-sm rounded-lg w-full p-2.5"
            />
            @if (f['email'].invalid && f['email'].dirty) {
              @if (f['email'].hasError('required')) {
                <div class="mt-2 font-normal text-red-500">Email is required</div>
              } @else {
                <div class="mt-2 font-normal text-red-500">Email format is invalid</div>
              }
            }
          </div>
          <button
            type="submit"
            [disabled]="resetForm.invalid || loading()"
            class="disabled:bg-gray-300 w-full text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center cursor-pointer"
          >
            Reset my password
          </button>
        </div>
      </form>
      <div class="mt-4">
        <a
          href="http://localhost:8080/login"
          class="block mt-4 text-base text-blue-600 hover:underline"
          >Sign in</a
        >
        <div class="mt-3 flex items-center justify-between">
          <a
            [routerLink]="['/register']"
            class="bg-blue-600 hover:bg-blue-700 p-2 rounded-md text-white block text-sm text-blue-600"
            >Create account</a
          >
          <a
            [routerLink]="['/']"
            class="inline-flex justify-center items-center bg-blue-600 hover:bg-blue-700 p-2 rounded-md text-white block text-sm text-blue-600"
          >
            Back to home
            <fa-icon [icon]="'chevron-right'" class="fa-fw"></fa-icon>
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
