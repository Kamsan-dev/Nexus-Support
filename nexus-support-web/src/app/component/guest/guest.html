<div class="min-h-screen flex flex-col">
  <nav class="bg-gray-900 fixed w-full top-0 left-0 z-40">
    <div class="container h-16 mx-auto">
      <div class="h-16 flex items-center justify-between">
        <div class="flex flex-1 items-center justify-left sm:items-stretch sm:justify-start">
          <div class="flex-shrink-0 items-center cursor-pointer" [routerLink]="['']">
            <img class="h-8 w-auto" src="https://cdn-icons-png.flaticon.com/512/9732/9732800.png" alt="Ticket App" />
          </div>
        </div>
        <div class="flex items-center">
          <a
            (click)="onLoginButtonClick($event)"
            class="hover:bg-gray-700 p-2.5 text-white hover:text-white font-medium rounded-lg text-sm px-5 py-2.5 text-center inline-flex items-center sm:mr-3"
          >
            Login
            <fa-icon [icon]="'chevron-right'" class="fa-fw"></fa-icon>
          </a>
          <a
            [routerLink]="['auth/register']"
            [routerLinkActive]="['bg-gray-700']"
            class="hover:bg-gray-700 p-1 text-white font-medium rounded-lg hidden text-sm px-5 py-2.5 text-center sm:inline-flex items-center lg:mr-3"
          >
            Register
            <fa-icon [icon]="'chevron-right'" class="fa-fw"></fa-icon>
          </a>
          <a
            [routerLink]="['auth/reset/password']"
            [routerLinkActive]="['bg-gray-700']"
            class="hover:bg-gray-700 p-1 text-white font-medium rounded-lg hidden text-sm px-5 py-2.5 text-center lg:inline-flex items-center mr-3"
          >
            Reset Password
            <fa-icon [icon]="'chevron-right'" class="fa-fw"></fa-icon>
          </a>
        </div>
      </div>
    </div>
  </nav>
  <div class="mt-12 flex-1">
    <router-outlet />
  </div>
  <footer class="container mx-auto px-4 sm:px-6 lg:px-0">
    <div class="text-blue-gray-600 border-t border-gray-200 mt-6">
      <div class="py-2">
        <div class="flex w-full flex-wrap items-center justify-center gap-6 px-2 md:justify-between">
          <p class="block antialiased font-sans text-sm leading-normal font-normal text-inherit">
            &#169; 2025
            <a class="transition-colors hover:text-blue-500 font-bold" [routerLink]="['/']" target="_blank">Nexus Support, LLC.</a>
          </p>
          <ul class="flex items-center gap-4">
            <li>
              <a
                href="#"
                target="_blank"
                class="block antialiased font-sans text-sm leading-normal py-0.5 px-1 font-normal text-inherit transition-colors hover:text-blue-500"
                >About Us</a
              >
            </li>
            <li>
              <a
                href="#"
                target="_blank"
                class="block antialiased font-sans text-sm leading-normal py-0.5 px-1 font-normal text-inherit transition-colors hover:text-blue-500"
                >Blog</a
              >
            </li>
            <li>
              <a
                href="#"
                target="_blank"
                class="block antialiased font-sans text-sm leading-normal py-0.5 px-1 font-normal text-inherit transition-colors hover:text-blue-500"
                >License</a
              >
            </li>
          </ul>
        </div>
      </div>
    </div>
  </footer>
</div>
